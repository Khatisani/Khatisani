name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:        
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate pink snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Khatisani
          outputs: |
            dist/pink-snake.svg?color_snake=%23FF1493&color_dots=%231a001a,%23330033,%234d004d,%23800080,%23FF1493

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
